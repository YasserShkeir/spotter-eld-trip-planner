# Render Infrastructure-as-Code.
# 1. Push this repo to GitHub.
# 2. In Render: New → "Blueprint" → connect repo. It picks up this file.
# 3. After the first deploy, set DJANGO_SECRET_KEY (and any optional vars) in
#    the Render dashboard. Everything else is auto-wired.
services:
  - type: web
    name: spotter-eld-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn eld_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://spotter-eld-frontend.vercel.app"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\\.vercel\\.app$"
      - key: HTTP_USER_AGENT
        value: "spotter-eld-planner/1.0 (assessment)"
      - key: DATABASE_URL
        fromDatabase:
          name: spotter-eld-db
          property: connectionString

databases:
  - name: spotter-eld-db
    plan: free
    databaseName: spotter_eld
    user: spotter_eld
